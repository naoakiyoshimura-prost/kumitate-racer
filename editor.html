<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1d2129" />
  <title>コースエディタ - 組立てレーサー</title>
  <link rel="stylesheet" href="/src/editor/editor.css" />
</head>
<body>
  <div id="app">
    <header id="top">
      <button id="nameBtn" class="name" title="コース名を変える"></button>
      <div class="seg" id="laneSeg">
        <button data-lanes="3">3レーン</button>
        <button data-lanes="5">5レーン</button>
      </div>
      <div class="seg" id="viewSeg">
        <button data-view="2d">2D</button>
        <button data-view="3d">3D</button>
      </div>
      <button id="menuBtn" aria-label="メニュー">☰</button>
    </header>

    <main id="stage">
      <canvas id="c2d"></canvas>
      <div id="c3d" hidden></div>
      <button id="fitBtn" class="float" title="全体を表示">全体</button>
      <div id="toast" role="status" hidden></div>
      <div id="hint" hidden>下のボタンで部品を追加してください</div>
    </main>

    <div id="side">
      <section id="status" aria-live="polite">
        <div id="stClosed"></div>
        <div id="stSel"></div>
        <button id="stMsg" hidden></button>
      </section>
      <section id="palette"></section>
      <section id="ops">
        <div class="seg wide" id="modeSeg">
          <button data-mode="end">出口側に追加</button>
          <button data-mode="start">入口側に追加</button>
          <button data-mode="insert">選択の後ろに挿入</button>
        </div>
        <div class="row">
          <button id="delBtn" class="danger">削除</button>
          <button id="flipBtn">左右反転</button>
          <button id="undoBtn">戻す</button>
          <button id="redoBtn">やり直す</button>
          <button id="runBtn" class="go">▶ 走る</button>
        </div>
        <div class="row">
          <button id="revBtn" title="同じコースを逆回りにする">スタート向き反転</button>
          <button id="clearBtn" class="danger" title="部品を全部消す（「戻す」で戻せます）">全消し</button>
        </div>
      </section>
    </div>
  </div>

  <div id="sheet" hidden>
    <div class="panel">
      <div class="sheet-head"><b id="sheetTitle"></b><button id="sheetClose">閉じる</button></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <script type="module" src="/src/editor/ui.ts"></script>
</body>
</html>
