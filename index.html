<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>組立てレーサー</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #fff;
      font-family: system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
    canvas { display: block; }
    #hud { position: fixed; top: 8px; left: 12px; font-size: 14px; opacity: .8; pointer-events: none; }
    #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: #111; font-size: 20px; text-align: center; padding: 24px; }
    #banner { position: fixed; top: 35%; width: 100%; text-align: center; font-size: 36px; font-weight: 800;
      color: #ffde3a; text-shadow: 0 2px 8px #000; pointer-events: none; }
    #speedlines { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #garage .fx { font-size: 12px; opacity: .85; }
    #hint { position: fixed; bottom: 10px; width: 100%; text-align: center; font-size: 13px; opacity: .7; pointer-events: none; }
    #timer { position: fixed; top: 8px; right: 12px; font-size: 18px; font-weight: 700;
      font-variant-numeric: tabular-nums; text-shadow: 0 1px 4px #000; pointer-events: none; }
    #gauge { position: fixed; left: 16px; top: 44px; width: 34vw; height: 14px; border-radius: 7px;
      background: rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.6); overflow: hidden; pointer-events: none; }
    #gauge-fill { height: 100%; width: 100%; background: #3ab0ff; }
    #gauge-fill.boosting { background: #ff8a00; }
    #gauge-fill.rejected { background: #ff3a3a; }
    #gauge-label { position: fixed; left: 16px; top: 28px; font-size: 12px; opacity: .8; pointer-events: none; }
    #boost { position: fixed; right: 20px; bottom: 20px; width: 84px; height: 84px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.7); background: rgba(80,80,80,.6); color: #fff; font-weight: 800;
      font-size: 15px; touch-action: none; }
    #boost.ready { background: rgba(255,138,0,.85); }
    #boost.active { background: #ffde3a; color: #222; }
    #transform { position: fixed; right: 116px; bottom: 26px; width: 66px; height: 66px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.7); background: rgba(80,80,80,.6); color: #fff; font-weight: 800;
      font-size: 14px; touch-action: none; }
    #transform.ready { background: rgba(26,143,255,.85); }
    #transform.active { background: #7fd0ff; color: #12324a; }
    .pad { position: fixed; bottom: 22px; width: 82px; height: 82px; border-radius: 50%; border: 3px solid rgba(255,255,255,.7);
      background: rgba(80,80,80,.55); color: #fff; font-size: 30px; font-weight: 800; touch-action: none; }
    .pad:active { background: rgba(255,255,255,.5); }
    #left { left: 18px; }
    #right { left: 112px; }
    #pause { position: fixed; top: 38px; right: 12px; padding: 4px 12px; border-radius: 14px; border: 2px solid rgba(255,255,255,.6);
      background: rgba(0,0,0,.45); color: #fff; font-size: 13px; font-weight: 700; touch-action: none; }
    #menu { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; background: rgba(0,0,0,.6); }
    #menu .big { font-size: 28px; font-weight: 800; }
    #menu button { font: inherit; color: #fff; border-radius: 8px; border: 1px solid rgba(255,255,255,.5); background: rgba(255,255,255,.12);
      padding: 10px 28px; min-width: 200px; }
    #menu .retire { background: #c8352a; border-color: #c8352a; }
    #brake { position: fixed; right: 116px; bottom: 102px; width: 62px; height: 62px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.7); background: rgba(80,80,80,.6); color: #fff; font-weight: 800;
      font-size: 13px; touch-action: none; }
    #brake.ready { background: rgba(220,40,40,.85); }
    #brake.active { background: #ff9a9a; color: #400; }
    #ex { position: fixed; right: 28px; bottom: 114px; width: 70px; height: 70px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.7); background: rgba(80,80,80,.6); color: #fff; font-weight: 800;
      font-size: 10px; line-height: 1.2; white-space: pre-line; letter-spacing: -0.5px; touch-action: none; }
    #ex.ready { background: rgba(200,60,255,.85); }
    #ex.active { background: #f0b6ff; color: #3a1048; }
    #result { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; background: rgba(0,0,0,.6); font-size: 18px; }
    #result .big { font-size: 44px; font-weight: 800; color: #ffde3a; }
    #result .small { font-size: 14px; opacity: .8; margin-top: 12px; }
    #result .buttons { display: flex; gap: 12px; margin-top: 12px; }
    #result button, #garage button { font: inherit; color: #fff; border-radius: 8px; border: 1px solid rgba(255,255,255,.5);
      background: rgba(255,255,255,.12); padding: 8px 14px; }
    #garage { position: fixed; inset: 0; z-index: 10; display: flex; gap: 12px; padding: 10px 12px; background: none; pointer-events: none;
      font-size: 13px; overflow: hidden; }
    #garage .parts, #garage .side { pointer-events: auto; background: rgba(16,20,28,.82); border-radius: 12px; padding: 8px 10px; }
    #garage .parts { flex: 1.25; overflow-y: auto; min-width: 0; }
    #garage .center { flex: 1.1; }
    #garage .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
    #garage .tabs button { padding: 3px 7px; font-size: 11px; background: rgba(255,255,255,.08); }
    #garage .tabs button.on { background: #3ab0ff; border-color: #3ab0ff; }
    #garage .course .chips { flex-wrap: nowrap; overflow-x: auto; }
    #garage .course .chips button { padding: 3px 7px; font-size: 11px; white-space: nowrap; flex: none; }
    #garage .row { grid-template-columns: 4.5em 1fr !important; }
    .in-garage #hud, .in-garage #timer, .in-garage #gauge, .in-garage #gauge-label, .in-garage .pad, .in-garage #brake,
    .in-garage #ex, .in-garage #transform, .in-garage #boost, .in-garage #hint { display: none; }
    #garage h2 { margin: 0 0 6px; font-size: 18px; color: #ffde3a; }
    #garage .row { display: grid; grid-template-columns: 7.5em 1fr; gap: 2px 8px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
    #garage .cat { opacity: .75; align-self: center; }
    #garage .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    #garage .chips button { padding: 5px 9px; font-size: 13px; }
    #garage .chips button.on { background: #ff8a00; border-color: #ff8a00; }
    #garage .note { grid-column: 2; font-size: 11px; opacity: .65; }
    #garage .side { flex: 0.85; display: flex; flex-direction: column; gap: 8px; justify-content: center; min-width: 0; }
    #garage .stat { display: grid; grid-template-columns: 5.5em 1fr; align-items: center; gap: 6px; }
    #garage .bar { position: relative; height: 10px; border-radius: 5px; background: rgba(255,255,255,.12); }
    #garage .bar div { height: 100%; border-radius: 5px; background: #3ab0ff; }
    #garage .bar i { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: rgba(255,255,255,.6); }
    #garage .hint { margin: 0; font-size: 11px; opacity: .6; }
    #garage .start { background: #ff8a00; border-color: #ff8a00; font-weight: 800; font-size: 16px; padding: 12px; }
    #garage .chips button b { font-size: 9px; margin-right: 4px; opacity: .7; }
    #garage .chips button small { font-size: 10px; margin-left: 5px; padding: 0 4px; border-radius: 6px; background: rgba(255,255,255,.18); }
    #garage .chips button.locked { opacity: .45; border-style: dashed; }
    #garage .chips button.over small { background: #d33; }
    #garage .chips button.pick { outline: 2px solid #ffde3a; opacity: 1; }
    #garage .chips button:disabled { opacity: .3; }
    #garage .coins { float: right; font-size: 15px; color: #ffde3a; }
    #garage .shop button { margin-left: 8px; padding: 3px 10px; background: #2a9d4b; border-color: #2a9d4b; }
    #garage .shop button:disabled { background: none; opacity: .5; }
    #garage .cost { font-size: 18px; font-weight: 800; }
    #garage .cost.bad, #garage .warn { color: #ff5a5a; }
    #garage .warn { margin: 0; font-size: 12px; }
    #garage .start:disabled { opacity: .4; }
    #result .prize { margin-top: 8px; color: #ffde3a; font-weight: 700; }
    #garage .reset { font-size: 12px; opacity: .8; }
    [hidden] { display: none !important; }
    @media (orientation: portrait) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <canvas id="speedlines"></canvas>
  <div id="hud">FPS: --</div>
  <div id="timer"></div>
  <div id="banner" hidden></div>
  <div id="gauge-label">ブースト / レーン変更ゲージ</div>
  <div id="gauge"><div id="gauge-fill"></div></div>
  <button id="left" class="pad">◀</button>
  <button id="right" class="pad">▶</button>
  <button id="brake">BRAKE</button>
  <button id="ex">EX</button>
  <button id="transform">変形</button>
  <button id="boost">BOOST</button>
  <button id="pause" hidden>II 一時停止</button>
  <div id="menu" hidden><div class="big">一時停止</div><button data-action="resume">続ける</button><button data-action="restart">最初からやり直す</button><button data-action="retire" class="retire">リタイヤ（ガレージへ）</button><div class="small">リタイヤは賞金なし</div></div>
  <div id="result" hidden></div>
  <div id="garage" hidden></div>
  <div id="hint">◀▶でレーン変更　ブレーキ・変形・EXもゲージを使う</div>
  <div id="rotate">スマホを横にしてね</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
