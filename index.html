<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>組立てレーサー</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #fff;
      font-family: system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
    canvas { display: block; }
    #hud { position: fixed; top: 8px; left: 12px; font-size: 14px; opacity: .8; pointer-events: none; }
    #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: #111; font-size: 20px; text-align: center; padding: 24px; }
    #banner { position: fixed; top: 35%; width: 100%; text-align: center; font-size: 36px; font-weight: 800;
      color: #ffde3a; text-shadow: 0 2px 8px #000; pointer-events: none; }
    #hint { position: fixed; bottom: 10px; width: 100%; text-align: center; font-size: 13px; opacity: .7; pointer-events: none; }
    #timer { position: fixed; top: 8px; right: 12px; font-size: 18px; font-weight: 700;
      font-variant-numeric: tabular-nums; text-shadow: 0 1px 4px #000; pointer-events: none; }
    #gauge { position: fixed; left: 16px; bottom: 36px; width: 38vw; height: 14px; border-radius: 7px;
      background: rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.6); overflow: hidden; pointer-events: none; }
    #gauge-fill { height: 100%; width: 100%; background: #3ab0ff; }
    #gauge-fill.boosting { background: #ff8a00; }
    #gauge-fill.rejected { background: #ff3a3a; }
    #gauge-label { position: fixed; left: 16px; bottom: 54px; font-size: 12px; opacity: .8; pointer-events: none; }
    #boost { position: fixed; right: 20px; bottom: 20px; width: 84px; height: 84px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.7); background: rgba(80,80,80,.6); color: #fff; font-weight: 800;
      font-size: 15px; touch-action: none; }
    #boost.ready { background: rgba(255,138,0,.85); }
    #boost.active { background: #ffde3a; color: #222; }
    #transform { position: fixed; right: 116px; bottom: 26px; width: 66px; height: 66px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.7); background: rgba(80,80,80,.6); color: #fff; font-weight: 800;
      font-size: 14px; touch-action: none; }
    #transform.ready { background: rgba(26,143,255,.85); }
    #transform.active { background: #7fd0ff; color: #12324a; }
    #ex { position: fixed; right: 28px; bottom: 114px; width: 70px; height: 70px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.7); background: rgba(80,80,80,.6); color: #fff; font-weight: 800;
      font-size: 10px; line-height: 1.2; white-space: pre-line; letter-spacing: -0.5px; touch-action: none; }
    #ex.ready { background: rgba(200,60,255,.85); }
    #ex.active { background: #f0b6ff; color: #3a1048; }
    #result { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; background: rgba(0,0,0,.6); font-size: 18px; }
    #result .big { font-size: 44px; font-weight: 800; color: #ffde3a; }
    #result .small { font-size: 14px; opacity: .8; margin-top: 12px; }
    #result .buttons { display: flex; gap: 12px; margin-top: 12px; }
    #result button, #garage button { font: inherit; color: #fff; border-radius: 8px; border: 1px solid rgba(255,255,255,.5);
      background: rgba(255,255,255,.12); padding: 8px 14px; }
    #garage { position: fixed; inset: 0; z-index: 10; display: flex; gap: 16px; padding: 12px 16px; background: rgba(16,20,28,.94);
      font-size: 13px; overflow: hidden; }
    #garage .parts { flex: 1.6; overflow-y: auto; min-width: 0; }
    #garage h2 { margin: 0 0 6px; font-size: 18px; color: #ffde3a; }
    #garage .row { display: grid; grid-template-columns: 7.5em 1fr; gap: 2px 8px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
    #garage .cat { opacity: .75; align-self: center; }
    #garage .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    #garage .chips button { padding: 5px 9px; font-size: 13px; }
    #garage .chips button.on { background: #ff8a00; border-color: #ff8a00; }
    #garage .note { grid-column: 2; font-size: 11px; opacity: .65; }
    #garage .side { flex: 1; display: flex; flex-direction: column; gap: 8px; justify-content: center; min-width: 0; }
    #garage .stat { display: grid; grid-template-columns: 5.5em 1fr; align-items: center; gap: 6px; }
    #garage .bar { position: relative; height: 10px; border-radius: 5px; background: rgba(255,255,255,.12); }
    #garage .bar div { height: 100%; border-radius: 5px; background: #3ab0ff; }
    #garage .bar i { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: rgba(255,255,255,.6); }
    #garage .hint { margin: 0; font-size: 11px; opacity: .6; }
    #garage .start { background: #ff8a00; border-color: #ff8a00; font-weight: 800; font-size: 16px; padding: 12px; }
    #garage .reset { font-size: 12px; opacity: .8; }
    [hidden] { display: none !important; }
    @media (orientation: portrait) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <div id="hud">FPS: --</div>
  <div id="timer"></div>
  <div id="banner" hidden></div>
  <div id="gauge-label">ブースト / レーン変更ゲージ</div>
  <div id="gauge"><div id="gauge-fill"></div></div>
  <button id="ex">EX</button>
  <button id="transform">変形</button>
  <button id="boost">BOOST</button>
  <div id="result" hidden></div>
  <div id="garage" hidden></div>
  <div id="hint">左右タップ／スワイプでレーン変更　変形＝直線で速く・曲がりで不利</div>
  <div id="rotate">スマホを横にしてね</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
