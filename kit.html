<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#14161b" />
  <title>部位キット確認 - 組立てレーサー</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #14161b; color: #eef1f5;
      font-family: system-ui, sans-serif; font-size: 12px; touch-action: none; user-select: none; -webkit-user-select: none; }
    #view { position: fixed; inset: 0; }
    #view canvas { display: block; width: 100%; height: 100%; }
    #stats { position: fixed; top: calc(6px + env(safe-area-inset-top)); left: 8px; padding: 4px 8px; border-radius: 6px;
      background: rgba(0,0,0,.5); font-variant-numeric: tabular-nums; line-height: 1.45; pointer-events: none; }
    #stats b { color: #ffd34d; }
    #panel { position: fixed; left: 0; right: 0; bottom: 0; padding: 6px 8px calc(8px + env(safe-area-inset-bottom));
      background: rgba(20,22,27,.9); border-top: 1px solid #333a45; display: flex; flex-direction: column; gap: 6px; }
    .row { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .row > span { color: #9aa3b2; min-width: 44px; }
    button { font: inherit; color: inherit; background: #2a2f38; border: 1px solid #454c58; border-radius: 6px; padding: 6px 8px; min-height: 32px; }
    button.on { background: #2f6fd6; border-color: #6fa3ff; }
    button:active { filter: brightness(1.3); }
    #state { flex: 1; min-width: 120px; accent-color: #ffd34d; }
    .marks { display: flex; justify-content: space-between; flex: 1; color: #9aa3b2; font-size: 10px; padding: 0 2px; }
    .chip { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 2px; vertical-align: -1px; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="stats"></div>
  <div id="panel">
    <div class="row"><span>状態</span><input id="state" type="range" min="0" max="3" step="0.01" value="0" /><button id="play">▶</button></div>
    <div class="row"><span></span><div class="marks"><i>NORMAL</i><i>BOOST1</i><i>BOOST2</i><i>BOOST3</i></div></div>
    <div class="row" id="rigRow"><span>ポッド</span></div>
    <div class="row"><span>表示</span><button id="explode">分解</button><button id="detail">high</button><button id="chassis" class="on">シャーシ</button></div>
    <div class="row" id="palRow"><span>色</span></div>
    <div class="row" id="camRow"><span>視点</span></div>
  </div>
  <script type="module" src="/src/bodykit/preview.ts"></script>
</body>
</html>
