<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>ボディ工房 - 組立てレーサー</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #15171c; color: #eef1f5;
      font-family: system-ui, sans-serif; font-size: 12px; touch-action: none; user-select: none; -webkit-user-select: none; }
    #app { position: fixed; inset: 0; display: grid; grid-template-columns: 74px 1fr 200px; grid-template-rows: 38px 1fr;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    button, select, input[type=text] { font: inherit; color: inherit; background: #2a2f38; border: 1px solid #454c58;
      border-radius: 6px; padding: 4px 6px; }
    button.on { background: #2f6fd6; border-color: #6fa3ff; }
    button.danger { background: #5a2226; border-color: #a0444b; }
    button:active { filter: brightness(1.3); }
    #top { grid-column: 1 / 4; display: flex; gap: 4px; align-items: center; padding: 4px 6px; background: #1d2129;
      border-bottom: 1px solid #333a45; overflow-x: auto; white-space: nowrap; }
    #top a { color: #fff; text-decoration: none; background: #3a404b; border-radius: 6px; padding: 5px 8px; }
    #top select { max-width: 120px; }
    #status { position: absolute; top: 6px; right: 6px; display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
      max-width: 62%; pointer-events: none; }
    #count { font-weight: 700; padding: 3px 7px; border-radius: 6px; background: rgba(0,0,0,.45); }
    #count.over { color: #ff5a5a; }
    #count.flash { animation: flash .6s; }
    @keyframes flash { 50% { color: #ff5a5a; transform: scale(1.15); } }
    #left { overflow-y: auto; padding: 4px; display: flex; flex-direction: column; gap: 4px; background: #1a1d24;
      border-right: 1px solid #333a45; }
    #left button { padding: 7px 2px; font-size: 11px; line-height: 1.15; }
    #left button.hollow { border-style: dashed; }
    #view { position: relative; overflow: hidden; }
    #view canvas { display: block; }
    #views { position: absolute; top: 6px; left: 6px; display: flex; gap: 3px; }
    #tools { position: absolute; bottom: 6px; left: 6px; display: flex; gap: 3px; flex-wrap: wrap; }
    #views button, #tools button { background: rgba(42,47,56,.85); }
    #views button.on, #tools button.on { background: rgba(47,111,214,.9); }
    #warn { padding: 3px 7px; border-radius: 6px; background: rgba(120,20,24,.85); text-align: right; }
    #warn.ok { background: rgba(30,90,50,.8); }
    #right { overflow-y: auto; padding: 6px; background: #1a1d24; border-left: 1px solid #333a45; }
    #right h3 { margin: 2px 0 6px; font-size: 14px; }
    .row { display: grid; grid-template-columns: 1fr auto; align-items: center; margin-bottom: 2px; }
    .row b { font-variant-numeric: tabular-nums; font-weight: 600; }
    .row input { grid-column: 1 / 3; width: 100%; margin: 0 0 4px; }
    .btns { display: flex; flex-wrap: wrap; gap: 3px; margin: 6px 0; }
    .btns button { flex: 1 1 auto; padding: 5px 4px; }
    .hint { opacity: .75; line-height: 1.5; }
    .bad { color: #ff8a8a; line-height: 1.4; }
    #file { border-top: 1px solid #333a45; margin-top: 8px; padding-top: 6px; display: flex; flex-direction: column; gap: 4px; }
    #file input, #file select { width: 100%; box-sizing: border-box; }
    #toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: rgba(0,0,0,.8); padding: 6px 12px;
      border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="app">
    <div id="top">
      <a href="./index.html">← ガレージ</a>
      <select id="chassis" aria-label="シャーシ"></select>
      <select id="tire" aria-label="タイヤ径"></select>
      <select id="tread" aria-label="トレッド幅"></select>
      <select id="booster" aria-label="ブースター"></select>
      <select id="paint" aria-label="塗装"></select>
    </div>
    <div id="left"></div>
    <div id="view">
      <div id="views">
        <button data-v="side" class="on">横</button>
        <button data-v="top">上</button>
        <button data-v="back">後ろ</button>
        <button data-v="persp">3D</button>
      </div>
      <div id="status"><span id="count"></span><span id="warn"></span></div>
      <div id="tools">
        <button id="sym" class="on">対称 ON</button>
        <button id="zones" class="on">ブースト位置</button>
        <button id="undo">↶ 戻す</button>
        <button id="redo">↷ やり直す</button>
      </div>
    </div>
    <div id="right">
      <div id="props"></div>
      <div id="file">
        <input id="name" type="text" maxlength="20" aria-label="ボディの名前" />
        <select id="line" aria-label="系統"></select>
        <select id="slot" aria-label="保存枠"></select>
        <div class="btns"><button id="save">保存</button><button id="load">読込</button></div>
        <select id="sample" aria-label="見本"></select>
      </div>
    </div>
  </div>
  <div id="toast"></div>
  <script type="module" src="/src/builder.ts"></script>
</body>
</html>
